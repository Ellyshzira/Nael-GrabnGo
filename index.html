<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#441d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrabnGo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<title>Nael GrabnGo</title>
<style>
:root{--bg:#fdf6ec;--card:#fffaf3;--ink:#3b1a0a;--mute:#8a6650;--line:#f0dcc0;--brand:#441d0b;--brand2:#a8693d;--accent:#dc9957;--tan:#ecbf8e;--soft:#f8e6cc;--onbrand:#fcebd4;--good:#3f7a2e;--goodbg:#e4f0d6;--warn:#a85d0c;--warnbg:#fde9c8;--bad:#b3261e;--badbg:#fbe0dc;--r:18px;--ring:rgba(168,105,61,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#1a100a;--card:#26170e;--ink:#fcebd4;--mute:#c4a58a;--line:#3e2a1c;--brand:#dc9957;--brand2:#a8693d;--soft:#3a2416;--onbrand:#2a1007;--goodbg:#1e3016;--warnbg:#3d2a0e;--badbg:#3e1712;--good:#9ccc7a;--warn:#f0b85c;--bad:#f28b82}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:#441d0b;color:#fcebd4;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(68,29,11,.25)}
header img{width:42px;height:42px;flex:0 0 42px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
header h1{font:600 19px/1.1 Fredoka,Nunito,sans-serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
header h1 small{display:block;font:600 10px Nunito,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.pill{font:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(252,235,212,.16);border:1px solid rgba(252,235,212,.25);color:#fcebd4;cursor:pointer}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:7px 0 6px;color:var(--mute);text-decoration:none;font-size:11px}
nav a span{display:block;font-size:21px;line-height:1.25;filter:grayscale(1);opacity:.7}
nav a.on{color:var(--brand2);font-weight:800}
nav a.on span{filter:none;opacity:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#5a2810 0%,#a8693d 60%,#dc9957 100%);color:#fcebd4;border:0;box-shadow:0 8px 22px rgba(68,29,11,.22);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:2px dashed rgba(252,235,212,.18)}
.hero small{opacity:.85}
.big{font:700 34px/1.15 Fredoka,Nunito,sans-serif;letter-spacing:-.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat small{color:var(--mute);display:block;font-size:12px}
.hero .stat small{color:#fcebd4;opacity:.85}
.stat b{font-size:17px}
h2{margin:20px 4px 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-size:12px}
h3{margin:0 0 8px;font:600 17px Fredoka,Nunito,sans-serif}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tap{cursor:pointer}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--mute);font-size:13px}
.right{text-align:right}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;background:var(--brand);color:var(--onbrand);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.stack>*+*{margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--onbrand);font-weight:700}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid .chip{border-radius:12px;padding:10px 4px;font-size:13px;text-align:center;white-space:normal}
.typegrid .chip span{display:block;font-size:20px}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--mute);font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--ring)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--brand2)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{flex:0 0 42px;height:44px;border:0;background:var(--soft);color:var(--brand2);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{border:0;border-radius:0;text-align:center;padding:0;height:44px;min-width:0;font-weight:700;box-shadow:none}
.prow .ptop{display:flex;gap:10px;align-items:flex-start}
.prow label.f{margin-top:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-good{background:var(--goodbg);color:var(--good)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-mute{background:var(--soft);color:var(--mute)}
.in{color:var(--good);font-weight:700}
.out{color:var(--bad);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;border-radius:99px;padding:14px 20px;box-shadow:0 8px 20px rgba(68,29,11,.35)}
.bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));z-index:4;background:#441d0b;color:#fcebd4;border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.bar b{font:600 18px Fredoka,Nunito,sans-serif}
.sheet{position:fixed;inset:0;z-index:20}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:up .22s ease}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#441d0b;color:#fcebd4;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty span{font-size:34px;display:block}
.bal{display:flex;justify-content:space-between;padding:4px 0}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);margin-top:10px}
.tips li{margin:0 0 8px}
.welcome-logo{display:block;width:170px;height:170px;margin:4px auto 6px}
.foot-logo{display:block;width:90px;margin:10px auto 0;opacity:.9}
h2{font-family:Nunito,sans-serif;font-weight:800}
.loccard{display:flex;gap:12px;align-items:center}
.proofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:4px}
.pthumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--mute);padding:0}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .doc{padding:6px;word-break:break-all;line-height:1.2}
.pthumb .doc b{display:block;font-size:26px;margin-bottom:2px}
.pthumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(42,16,7,.75);color:#fff;font-size:14px;line-height:24px;cursor:pointer;padding:0}
.pthumb .wait{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(42,16,7,.75);color:#fcebd4;border-radius:6px;padding:1px 5px}
.padd{aspect-ratio:1;border-radius:12px;border:2px dashed var(--tan);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brand2);font-weight:800;font-size:12px;cursor:pointer;background:transparent}
.padd span{font-size:24px}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.94);display:flex;flex-direction:column}
.viewer.hidden{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fcebd4}
.vbar .grow{font-weight:700;font-size:14px}
.vbar a,.vbar button{color:#fcebd4;background:rgba(252,235,212,.14);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.vbody{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:pinch-zoom pan-x pan-y}
.vbody img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vbody .docbox{color:#fcebd4;text-align:center}
.vbody .docbox b{font-size:60px;display:block}
.clip{font-size:12px;color:var(--brand2);font-weight:800}
.locicon{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 44px}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><h1><span id="title">Nael GrabnGo</span><small>Grab. Go. Enjoy.</small></h1><button class="pill" id="syncPill" data-act="syncNow">…</button></header>
<main id="view"></main>
<nav id="tabs">
  <a href="#home" data-r="home"><span>🏠</span>Home</a>
  <a href="#check" data-r="check"><span>📦</span>Stock check</a>
  <a href="#money" data-r="money"><span>💰</span>Money</a>
  <a href="#products" data-r="products"><span>🏷️</span>Products</a>
  <a href="#more" data-r="more"><span>⚙️</span>More</a>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-body"></div></div>
<div id="toast"></div>
<div id="viewer" class="viewer hidden"></div>

<script>
'use strict';
/* =========================================================
   Nael GrabnGo — stock & cash-flow app (PWA)
   Data lives in your Google Sheet (via Apps Script).
   Without a connection it runs in DEMO mode on this phone only.
   ========================================================= */

const TABLES = ['Products','Locations','Visits','Stock','Money','Settings'];
const NUMS = ['packQty','packCost','extraCost','price','reorderLevel','cash','qr','expected','opening','counted','sold','added','closing','unitCost','amount'];
const BOOLS = ['active','deleted'];
const CATEGORIES = ['Drink','Snack','Instant Food','Other'];
const MTYPES = [
  {k:'Sales Deposit', i:'💵', hint:'Sales money (cash/QR) that went into the business account.'},
  {k:'Restock',       i:'🛒', hint:'Buying stock to sell (Eco, 99 Speedmart, wholesaler…).'},
  {k:'Expense',       i:'🧾', hint:'Other costs: ice, box, poster printing, fees.'},
  {k:'Reimbursement', i:'↩️', hint:'Business account pays a partner back for money they spent.'},
  {k:'Capital In',    i:'🏦', hint:'A partner puts own money into the business account.'},
  {k:'Adjustment',    i:'⚖️', hint:'Make the balance match the bank. Use a minus (−) amount to reduce.'}
];

/* ---------- small helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round = (n, d=2) => Math.round((Number(n)||0) * 10**d) / 10**d;
const rm = n => { n = round(n); return (n < 0 ? '−' : '') + 'RM' + Math.abs(n).toFixed(2); };
const sum = (arr, f) => arr.reduce((a, r) => a + (typeof f === 'function' ? f(r) : num(r[f])), 0);
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const fmtDate = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); };
const fmtMonth = k => { const d = new Date(k + '-01T00:00:00'); return isNaN(d) ? k : d.toLocaleDateString('en-GB', {month:'long', year:'numeric'}); };
const daysAgo = s => Math.round((new Date(today() + 'T00:00:00') - new Date(s + 'T00:00:00')) / 86400000);
const agoText = s => { const n = daysAgo(s); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };

/* ---------- storage (safe even if localStorage is blocked) ---------- */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('gng_' + k); if (v != null) return JSON.parse(v); } catch (e) {} return (k in mem) ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem('gng_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem('gng_' + k); } catch (e) {} }
};

/* ---------- pending proof files (kept on the phone until uploaded) ---------- */
const blobMem = {};
const blobs = {
  get(k) { if (blobMem[k]) return blobMem[k]; try { return localStorage.getItem('gng_blob_' + k); } catch (e) { return null; } },
  set(k, v) { blobMem[k] = v; try { localStorage.setItem('gng_blob_' + k, v); return true; } catch (e) { return false; } },
  del(k) { delete blobMem[k]; try { localStorage.removeItem('gng_blob_' + k); } catch (e) {} }
};
const proofUrlCache = {};   // drive id -> object URL (this session)

/* ---------- state ---------- */
const emptyData = () => Object.fromEntries(TABLES.map(t => [t, []]));
let cfg = store.get('cfg', {apiUrl:'', pin:'', me:''});
let data = store.get('data', null);
let queue = store.get('queue', []);
let sync = {state:'idle', error:'', last: store.get('lastSync', null)};
let route = location.hash.slice(1) || 'home';
let sheetOpen = false;
let moneyFilter = {month: today().slice(0,7), type:'All'};
let chk = store.get('draft', null) || newCheck('');
let mf = null, pf = null;   // money form / product form state
const isDemo = () => !cfg.apiUrl;

function newCheck(loc) { return {loc, date: today(), by: cfg.me || '', lines:{}, cash:'', qr:'', deposit:true, notes:''}; }
function persist() { store.set('data', data); store.set('queue', queue); }
function saveDraft() { store.set('draft', chk); }

/* ---------- starter data from your old Excel file ---------- */
function seedRows() {
  const L = [['office','Office'],['tasik','Tasik Cyberjaya'],['putrajaya','Putrajaya']]
    .map(([id,name]) => ({id, name, active:true, deleted:false}));
  // sku, name, category, units per pack, pack cost, extra cost, sell price, reorder level
  const P = [
    ['SNK-001','Maggie Biasa','Instant Food',17,15,0,1.5,5],
    ['SNK-002','Maggie Chef / Big','Instant Food',8,12.15,0,2.5,4],
    ['SNK-003','Bika (3 pcs)','Snack',4,5.2,0,2,2],
    ['SNK-004','Mamee','Snack',10,6,0,1,5],
    ['SNK-005','Bubur Instant','Instant Food',6,15.6,0,3.5,3],

    ['DRK-002','Boom+','Drink',96,146,0,3,24],
    ['DRK-003','Mineral','Drink',48,25.8,0,2,10]
  ].map(r => ({id:r[0], sku:r[0], name:r[1], category:r[2], packQty:r[3], packCost:r[4], extraCost:r[5], price:r[6], reorderLevel:r[7], active:true, deleted:false}));
  const B = 'Business Account', O = 'Own Money';
  // date, location, item, type, amount, paid using, paid by, notes
  const M = [
    ["2026-07-15", "office", "Eco + 99speedmart (Lysa share)", "Restock", 46.8, O, "Lysa", "Part of RM84.70 purchase"],
    ["2026-07-15", "office", "Eco + 99speedmart (Meo share)", "Restock", 37.9, O, "Meo", "Part of RM84.70 purchase"],
    ["2026-07-16", "office", "KITKAT", "Restock", 34, O, "Meo", ""],
    ["2026-07-24", "office", "Eco + 99speedmart", "Restock", 98.55, O, "Meo", ""],
    ["2026-07-26", "tasik", "Balji + Hausboom", "Restock", 173.16, O, "Meo", ""],
    ["2026-07-26", "tasik", "Sales collected 16/7–26/7", "Sales Deposit", 116.5, B, "", "Money received into business account"],
    ["2026-08-03", "tasik", "Mineral", "Restock", 25.8, B, "", ""],

    ["2026-08-04", "", "Sales collected 28/7–4/8", "Sales Deposit", 228, B, "", "Date fixed from 2026-04-08 in Excel"],
    ["2026-08-05", "tasik", "Mineral & Dutch Lady", "Restock", 46.8, B, "", ""],

/* ---------- local data access ---------- */
function normalizeRow(r) {
  const o = {...r};
  NUMS.forEach(k => { if (k in o && o[k] !== '') o[k] = num(o[k]); });
  BOOLS.forEach(k => { if (k in o) o[k] = (o[k] === true || o[k] === 'TRUE' || o[k] === 'true'); });
  if (o.date) o.date = String(o.date).slice(0, 10);
  if (o.id != null) o.id = String(o.id);
  if ('proof' in o) {
    if (typeof o.proof === 'string') { try { o.proof = o.proof ? JSON.parse(o.proof) : []; } catch (e) { o.proof = []; } }
    if (!Array.isArray(o.proof)) o.proof = [];
  }
  return o;
}
function upsertLocal(table, row) {
  const arr = data[table]; const i = arr.findIndex(r => r.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
}
function save(table, row) { saveMany([[table, row]]); }
function saveMany(list) {
  const now = new Date().toISOString();
  list.forEach(([t, r]) => {
    const row = normalizeRow({...r, updatedAt: now});
    upsertLocal(t, row);
    if (!isDemo()) queue.push({table: t, row: forServer(row)});
  });
  persist(); setSync(); flush();
}

/** Copy of a row ready for the Google Sheet (proof list stored as text) */
function forServer(row) {
  const o = {...row};
  if (Array.isArray(o.proof)) {
    const list = o.proof.map(f => f.id ? {id: f.id, name: f.name, mime: f.mime} : {tmp: f.tmp, name: f.name, mime: f.mime, pending: true});
    o.proof = list.length ? JSON.stringify(list) : '';
    o.proofLinks = o.proof ? o.proofLinks || list.filter(f => f.id).map(f => 'https://drive.google.com/file/d/' + f.id + '/view').join('\n') : '';
  }
  return o;
}

/** How one money record changes the business account and what the business owes each partner */
function effect(m) {
  const a = num(m.amount), own = m.paidUsing === 'Own Money';
  const e = {acct: 0, owed: 0, person: m.paidBy || ''};
  switch (m.type) {
    case 'Sales Deposit': e.acct = a; break;
    case 'Restock': case 'Expense': if (own) e.owed = a; else e.acct = -a; break;
    case 'Reimbursement': e.acct = -a; e.owed = -a; break;
    case 'Capital In': e.acct = a; e.owed = a; break;
    case 'Adjustment': e.acct = a; break;
  }
  return e;
}
function moneyTotals(rows = money()) {
  let acct = 0; const owed = {}; people().forEach(p => owed[p] = 0);
  rows.forEach(m => { const e = effect(m); acct += e.acct; if (e.owed && e.person) owed[e.person] = (owed[e.person] || 0) + e.owed; });
  return {acct: round(acct), owed};
}
function effectText(m) {
  const e = effect(m), parts = [];
  if (e.acct) parts.push('Business account ' + (e.acct > 0 ? '+' : '') + rm(e.acct));
  if (e.owed && e.person) parts.push(e.owed > 0 ? `Business owes ${e.person} +${rm(e.owed)}` : `Owed to ${e.person} ${rm(e.owed)}`);
  return parts.join(' · ') || 'No change to balances';
}

/* ---------- sync with Google Sheets ---------- */
let flushing = false;
function setSync(state, err) {
  if (state) sync.state = state;
  if (err !== undefined) sync.error = err;
  const p = $('#syncPill'); if (!p) return;
  const ups = queue.filter(o => o.kind === 'upload').length;
  if (isDemo()) p.textContent = 'Demo mode';
  else if (!navigator.onLine) p.textContent = queue.length ? `Offline · ${queue.length} to sync` : 'Offline';
  else if (sync.state === 'syncing') p.textContent = ups ? `Uploading ${ups} file${ups > 1 ? 's' : ''}…` : 'Syncing…';
  else if (sync.state === 'error') p.textContent = '⚠ Sync failed';
  else if (queue.length) p.textContent = `${queue.length} to sync`;
  else p.textContent = 'Synced ✓';
}
async function apiPost(body) {
  const res = await fetch(cfg.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key: cfg.pin, ...body})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j;
}
/** After a file is uploaded, swap its temporary entry for the Drive file everywhere */
function swapProof(rowId, tmp, file) {
  const fix = list => (list || []).map(f => f.tmp === tmp ? file : f);
  const local = data.Money.find(m => m.id === rowId);
  if (local) local.proof = fix(local.proof);
  queue.forEach(op => {
    if (op.table === 'Money' && op.row && op.row.id === rowId && op.row.proof) {
      let list = []; try { list = JSON.parse(op.row.proof); } catch (e) {}
      op.row.proof = JSON.stringify(fix(list).map(f => f.id ? {id: f.id, name: f.name, mime: f.mime} : f));
      op.row.proofLinks = fix(list).filter(f => f.id).map(f => 'https://drive.google.com/file/d/' + f.id + '/view').join('\n');
    }
  });
}
async function flush() {
  if (isDemo() || flushing || !queue.length) return;
  if (!navigator.onLine) return setSync('offline');
  flushing = true; setSync('syncing');
  try {
    while (queue.length) {
      const op = queue[0];
      if (op.kind === 'upload') {
        const dataUrl = blobs.get(op.tmp);
        if (dataUrl) {
          const j = await apiPost({action: 'upload', name: op.name, mime: op.mime, data: dataUrl.split(',')[1]});
          proofUrlCache[j.id] = dataUrl;
          swapProof(op.rowId, op.tmp, {id: j.id, name: j.name || op.name, mime: op.mime});
          blobs.del(op.tmp);
        }
        queue.shift(); persist(); setSync('syncing');
        continue;
      }
      let n = 0;
      while (n < queue.length && n < 150 && queue[n].kind !== 'upload') n++;
      await apiPost({ops: queue.slice(0, n).map(o => ({table: o.table, row: o.row}))});
      queue = queue.slice(n); persist();
    }
    flushing = false;
    await pull();
  } catch (e) { flushing = false; setSync('error', e.message); }
}
async function pull() {
  if (isDemo()) return;
  if (!navigator.onLine) return setSync('offline');
  if (queue.length && !flushing) return flush();
  setSync('syncing');
  try {
    const res = await fetch(cfg.apiUrl + '?action=all&key=' + encodeURIComponent(cfg.pin) + '&t=' + Date.now());
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Server error');
    const d = emptyData();
    TABLES.forEach(t => {   // if an id appears twice in the sheet, the lower row wins
      const byId = new Map();
      (j.data[t] || []).map(normalizeRow).filter(r => r.id).forEach(r => byId.set(r.id, r));
      d[t] = [...byId.values()];
    });
    data = d;
    queue.forEach(op => { if (op.table && op.row) upsertLocal(op.table, normalizeRow(op.row)); });   // keep unsynced changes visible
    // pending files still waiting: show them from the phone
    queue.filter(op => op.kind === 'upload').forEach(op => {
      const m = data.Money.find(x => x.id === op.rowId);
      if (m && !(m.proof || []).some(f => f.tmp === op.tmp)) m.proof = [...(m.proof || []), {tmp: op.tmp, name: op.name, mime: op.mime}];
    });
    sync.last = new Date().toISOString(); store.set('lastSync', sync.last);
    persist(); setSync('ok', ''); softRender();
  } catch (e) { setSync('error', e.message); }
}

  // don't wipe a form the user is typing in
  if (sheetOpen || (route === 'check' && chk.loc)) { renderHeader(); return; }
  render();

function calcLine(p, last, L) {
  L = L || {};

  const added = Math.max(0, num(L.added));
  const counted = hasCount ? Math.max(0, num(L.counted)) : opening;

  return {include, opening, counted, added, sold, closing: counted + added, first: last == null};
}

async function proofUrl(f) {
  if (f.tmp) return blobs.get(f.tmp);
  if (!f.id) return null;
  if (proofUrlCache[f.id]) return proofUrlCache[f.id];
  if (isDemo() || !navigator.onLine) return null;
  const res = await fetch(cfg.apiUrl + '?action=file&id=' + encodeURIComponent(f.id) + '&key=' + encodeURIComponent(cfg.pin));
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Could not load file');
  const bin = atob(j.data), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return (proofUrlCache[f.id] = URL.createObjectURL(new Blob([arr], {type: j.mime || f.mime})));
}
function loadThumbs(root) {
  $$('img[data-pk],img[data-tmp]', root || document).forEach(async img => {
    const f = {id: img.dataset.pk, tmp: img.dataset.tmp, mime: 'image/*'};
    try { const u = await proofUrl(f); if (u) img.src = u; else img.replaceWith(Object.assign(document.createElement('div'), {className: 'doc', innerHTML: '<b>🖼️</b>offline'})); }
    catch (e) { img.replaceWith(Object.assign(document.createElement('div'), {className: 'doc', innerHTML: '<b>⚠️</b>can\'t load'})); }
  });
}

    const body = $('.vbody', v);
    if (!u) { body.innerHTML = '<div class="docbox"><b>📶</b>Connect to the internet to view this file.</div>'; return; }
    $('#vOpen').innerHTML = `<a href="${u}" target="_blank" rel="noopener" download="${esc(f.name || 'proof')}">Open</a>`;
    body.innerHTML = isImg(f) ? `<img src="${u}" alt="">` : `<div class="docbox"><b>📄</b>${esc(f.name || 'PDF')}<br><br><a class="btn" href="${u}" target="_blank" rel="noopener" download="${esc(f.name || 'proof.pdf')}">Open PDF</a></div>`;
  } catch (e) { $('.vbody', v).innerHTML = `<div class="docbox"><b>⚠️</b>${esc(e.message)}</div>`; }
}
const fileToDataUrl = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}
async function addProofFiles(files) {
  if (!mf) return;
  readForm('mform', mf);
  mf.proof = mf.proof || []; mf._newTmps = mf._newTmps || [];
  for (const file of files) {
    const pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const img = /^image\//.test(file.type);
    if (!pdf && !img) { toast('Only photos or PDF files'); continue; }
    if (file.size > 10 * 1024 * 1024) { toast(file.name + ' is bigger than 10 MB'); continue; }
    let dataUrl, mime = pdf ? 'application/pdf' : 'image/jpeg', name = file.name || 'proof';
    try {
      if (img) { dataUrl = await shrinkImage(file); name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
      else dataUrl = await fileToDataUrl(file);
    } catch (e) { dataUrl = await fileToDataUrl(file); mime = file.type || mime; }
    const tmp = 'tmp-' + uid();
    if (!blobs.set(tmp, dataUrl)) toast('Phone storage is full — keep the app open until it syncs');
    mf.proof.push({tmp, name, mime});
    mf._newTmps.push(tmp);
  }
  openSheet(moneyForm()); loadThumbs($('#sheet'));
}

/* ----- Products ----- */
VIEWS.products = () => {
  const sm = stockMap();
  const total = pid => Object.values(sm).reduce((a, l) => a + (l[pid] ? l[pid].qty : 0), 0);
  const ps = products();
  const byCat = {};
  ps.forEach(p => (byCat[p.category || 'Other'] = byCat[p.category || 'Other'] || []).push(p));
  return `${Object.keys(byCat).length ? Object.entries(byCat).map(([c, list]) => `<h2>${esc(c)}</h2><div class="card">${list.map(p => {
    const uc = unitCost(p), pr = num(p.price), mg = pr > 0 ? (pr - uc) / pr * 100 : 0;
    return `<div class="row tap" data-act="editProd" data-id="${esc(p.id)}"><div class="grow"><b>${esc(p.name)}</b>${p.active === false ? ' <span class="badge b-mute">hidden</span>' : ''}<div class="muted">Cost ${rm(uc)} · Sell ${rm(pr)} · ${total(p.id)} in stock</div></div><span class="badge ${mg >= 30 ? 'b-good' : mg >= 15 ? 'b-warn' : 'b-bad'}">${Math.round(mg)}%</span></div>`;
  }).join('')}</div>`).join('') : `<div class="card">${emptyBox('🏷️', 'No products yet')}</div>`}
  <div class="note">The % is your <b>gross margin</b> (profit ÷ selling price). Green ≥ 30%, amber 15–30%, red below 15%.</div>
  <button class="btn fab" data-act="addProd">＋ Product</button>`;
};

    <label class="f">Product name</label><input name="name" value="${esc(p.name)}" placeholder="e.g. 100plus 500ml">
    <div class="grid2"><div><label class="f">Category</label><select name="category">${CATEGORIES.map(c => `<option ${c === p.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div><label class="f">SKU / code</label><input name="sku" value="${esc(p.sku)}" placeholder="DRK-004"></div></div>
    <div class="grid2"><div><label class="f">Units per pack</label><input name="packQty" type="number" inputmode="numeric" value="${esc(p.packQty)}" placeholder="24"></div>
    <div><label class="f">Pack cost (RM)</label><input name="packCost" type="number" inputmode="decimal" step="0.01" value="${esc(p.packCost)}" placeholder="0.00"></div></div>
    <div class="grid2"><div><label class="f">Extra cost / pack</label><input name="extraCost" type="number" inputmode="decimal" step="0.01" value="${esc(p.extraCost)}" placeholder="ice, transport"></div>
    <div><label class="f">Selling price (RM)</label><input name="price" type="number" inputmode="decimal" step="0.10" value="${esc(p.price)}" placeholder="0.00"></div></div>
    <label class="f">Top-up alert when this many left (per location)</label><input name="reorderLevel" type="number" inputmode="numeric" value="${esc(p.reorderLevel)}" placeholder="5">
    <label class="check"><input type="checkbox" name="active" ${p.active !== false ? 'checked' : ''}> Show in stock check (untick if you stop selling it)</label>
    <div class="note" id="pCalc"></div>
    <div class="stack" style="margin-top:14px"><button type="button" class="btn block" data-act="saveProd">Save product</button>
    <button type="button" class="btn ghost block" data-act="closeSheet">Cancel</button></div></form>`;
}
function updatePCalc() {
  const el = $('#pCalc'); if (!el || !pf) return;
  readForm('pform', pf);
  const uc = unitCost(pf), pr = num(pf.price), pft = pr - uc;
  const sug = m => rm(Math.ceil(uc / (1 - m) * 10) / 10);
  el.innerHTML = uc > 0
    ? `Cost per unit <b>${rm(uc)}</b> · Profit per unit <b>${rm(pft)}</b> · Margin <b>${pr > 0 ? Math.round(pft / pr * 100) : 0}%</b><br><span class="muted">Price for 30% margin: ${sug(.3)} · 40%: ${sug(.4)} · 50%: ${sug(.5)}</span>`
    : 'Enter units per pack and pack cost to see your cost and margin.';
}

    <button class="btn ghost block" style="margin-top:10px" data-act="addLoc">＋ Add location</button>
  </div>

  <div class="card tips"><h3>💡 Routine that keeps the numbers right</h3><ol style="padding-left:20px;margin:0">

/* =================== ACTIONS =================== */
const ACT = {
  syncNow() { if (isDemo()) { go('more'); toast('Connect a Google Sheet in More to sync'); return; } flush(); pull(); },
  closeSheet() { closeSheet(); },
  rmProof(t, e) {
    e.stopPropagation(); readForm('mform', mf);
    const f = mf.proof[num(t.dataset.i)];
    if (f && f.id && !confirm('Remove this proof from the record? (The file stays in your Google Drive folder.)')) return;
    mf.proof.splice(num(t.dataset.i), 1); openSheet(moneyForm()); loadThumbs($('#sheet'));
  },
  viewProof(t) { const f = (mf && mf.proof || [])[num(t.dataset.i)]; if (f) openViewer(f); },
  closeViewer() { $('#viewer').classList.add('hidden'); $('#viewer').innerHTML = ''; },
  closeViewerBg(t, e) { if (e.target === t) ACT.closeViewer(); },
  startCheck(t) {
    const id = t.dataset.id;
    if (chk.loc !== id) { chk = newCheck(id); saveDraft(); }
    go('check');
  },
  cancelCheck() {
    if (Object.keys(chk.lines).length && !confirm('Discard this stock check?')) return;
    chk = newCheck(''); saveDraft(); render();
  },
  clearCheck() { if (!confirm('Clear all numbers you entered?')) return; chk = newCheck(chk.loc); saveDraft(); render(); },
  step(t) {
    const input = t.parentElement.querySelector('input');
    const base = input.value === '' ? (t.dataset.f === 'counted' ? num(input.placeholder) : 0) : num(input.value);
    input.value = Math.max(0, base + num(t.dataset.d));
    onLineInput(input);
  },
  saveCheck() {
    const sm = stockMap()[chk.loc] || {}, vid = uid(); let exp = 0; const lines = [];
    activeProducts().forEach(p => {
      const last = sm[p.id] ? sm[p.id].qty : null, c = calcLine(p, last, chk.lines[p.id]);
      if (!c.include) return;
      if (c.sold > 0) exp += c.sold * num(p.price);
      lines.push({id: uid(), visitId: vid, date: chk.date, locationId: chk.loc, productId: p.id, opening: c.opening, counted: c.counted, sold: c.sold, added: c.added, closing: c.closing, price: num(p.price), unitCost: round(unitCost(p), 4), deleted: false});
    });
    const cash = num(chk.cash), qr = num(chk.qr);
    if (!lines.length && !(cash + qr)) return toast('Enter at least one count or amount');
    const v = {id: vid, date: chk.date, locationId: chk.loc, by: chk.by || me(), cash, qr, expected: round(exp), notes: chk.notes || '', deleted: false};
    const ops = [['Visits', v], ...lines.map(l => ['Stock', l])];
    if (chk.deposit && cash + qr > 0) ops.push(['Money', {id: uid(), date: chk.date, locationId: chk.loc, item: 'Sales ' + locName(chk.loc), type: 'Sales Deposit', amount: round(cash + qr), paidUsing: 'Business Account', paidBy: '', notes: 'From stock check', visitId: vid, deleted: false}]);
    saveMany(ops);
    const gap = cash + qr - exp;
    chk = newCheck(''); saveDraft(); render();
    toast(`Saved ✓ Expected ${rm(exp)}, collected ${rm(cash + qr)}${exp > 0 && gap < -0.5 ? ' (short ' + rm(-gap) + ')' : ''}`);
  },
  visit(t) { showVisit(t.dataset.id); },
  delVisit(t) {
    const id = t.dataset.id;
    if (!confirm('Delete this stock check? Its counts and the linked sales deposit will be removed.')) return;
    const ops = [];
    const v = data.Visits.find(x => x.id === id); if (v) ops.push(['Visits', {...v, deleted: true}]);
    data.Stock.filter(s => s.visitId === id).forEach(s => ops.push(['Stock', {...s, deleted: true}]));
    data.Money.filter(m => m.visitId === id).forEach(m => ops.push(['Money', {...m, deleted: true}]));
    saveMany(ops); closeSheet(); toast('Deleted');
  },
  addMoney() { mf = {_new: true, id: uid(), date: today(), type: 'Restock', amount: '', item: '', locationId: '', paidUsing: 'Business Account', paidBy: '', notes: '', visitId: '', deleted: false, proof: []}; openSheet(moneyForm()); },
  editMoney(t) { const m = data.Money.find(x => x.id === t.dataset.id); if (!m) return; mf = {...m, proof: [...(m.proof || [])]}; openSheet(moneyForm()); loadThumbs($('#sheet')); },
  mType(t) { readForm('mform', mf); mf.type = t.dataset.k; fixPay(mf); openSheet(moneyForm()); loadThumbs($('#sheet')); },
  mPay(t) { readForm('mform', mf); mf.paidUsing = t.dataset.k; fixPay(mf); openSheet(moneyForm()); loadThumbs($('#sheet')); },
  mWho(t) { readForm('mform', mf); mf.paidBy = t.dataset.k; openSheet(moneyForm()); loadThumbs($('#sheet')); },
  saveMoney() {
    readForm('mform', mf); fixPay(mf);
    const a = num(mf.amount);
    if (!a || (a < 0 && mf.type !== 'Adjustment')) return toast('Enter a valid amount');
    if (!mf.date) return toast('Pick a date');
    const row = {...mf, amount: round(a)}; delete row._new; delete row._newTmps;
    // queue new files first so they upload before the record is saved
    const pending = (row.proof || []).filter(f => f.tmp && (mf._newTmps || []).includes(f.tmp));
    if (!isDemo()) pending.forEach(f => queue.push({kind: 'upload', rowId: row.id, tmp: f.tmp, name: f.name, mime: f.mime}));
    // forget files that were added then removed before saving
    (mf._newTmps || []).filter(t => !(row.proof || []).some(f => f.tmp === t)).forEach(t => blobs.del(t));
    mf._newTmps = [];
    save('Money', row); closeSheet(); toast(pending.length ? `Saved ✓ uploading ${pending.length} file${pending.length > 1 ? 's' : ''}…` : 'Saved ✓');
  },
  delMoney() { if (!confirm('Delete this record?')) return; const row = {...mf, deleted: true}; delete row._new; save('Money', row); closeSheet(); toast('Deleted'); },
  addProd() { pf = {_new: true, id: uid(), sku: '', name: '', category: 'Drink', packQty: '', packCost: '', extraCost: '', price: '', reorderLevel: 5, active: true, deleted: false}; openSheet(prodForm()); updatePCalc(); },
  editProd(t) { const p = data.Products.find(x => x.id === t.dataset.id); if (!p) return; pf = {...p}; openSheet(prodForm()); updatePCalc(); },
  saveProd() {
    readForm('pform', pf);
    if (!String(pf.name).trim()) return toast('Enter a product name');
    if (!num(pf.price)) return toast('Enter a selling price');
    const row = {...pf, name: String(pf.name).trim(), active: !!pf.active}; delete row._new;
    save('Products', row); closeSheet(); toast('Product saved ✓');
  },
  setMe(t) { cfg.me = t.dataset.k; store.set('cfg', cfg); if (!chk.by) chk.by = cfg.me; if (sheetOpen) closeSheet(); else render(); toast('Hi ' + cfg.me + '!'); },
  async saveConn() {
    const url = $('#cUrl').value.trim(), pin = $('#cPin').value.trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('URL should start with https://script.google.com/');
    const changed = url !== cfg.apiUrl;
    if (changed && url && isDemo() && !confirm('Switch to your Google Sheet? Demo data on this phone will be cleared.')) return;
    cfg.apiUrl = url; cfg.pin = pin; store.set('cfg', cfg);
    if (changed) { data = emptyData(); queue = []; sync.last = null; persist(); if (!url) loadSeedLocal(); }
    render();
    if (url) { toast('Connecting…'); await pull(); toast(sync.state === 'error' ? 'Could not connect: ' + sync.error : 'Connected ✓'); render(); }
  },
  importSeed() {
    if (data.Money.length && !confirm('There are already records. Import anyway?')) return;
    const s = seedRows(), ops = [];
    Object.keys(s).forEach(t => s[t].forEach(r => ops.push([t, r])));
    saveMany(ops); toast('Importing ' + ops.length + ' records…'); render();
  },
  saveBiz() {
    const name = $('#sBiz').value.trim() || 'Nael GrabnGo';
    const ppl = $('#sPeople').value.split(',').map(s => s.trim()).filter(Boolean).join(',');
    saveMany([['Settings', {id: 'businessName', value: name}], ['Settings', {id: 'people', value: ppl || 'Lysa,Meo'}]]);
    render(); toast('Saved ✓');
  },
  addLoc() { const n = prompt('Location name (e.g. Putrajaya Presint 9 lake)'); if (!n || !n.trim()) return; save('Locations', {id: uid(), name: n.trim(), active: true, deleted: false}); render(); },
  renameLoc(t) { const l = data.Locations.find(x => x.id === t.dataset.id); const n = prompt('New name', l.name); if (!n || !n.trim()) return; save('Locations', {...l, name: n.trim()}); render(); },
  toggleLoc(t) { const l = data.Locations.find(x => x.id === t.dataset.id); save('Locations', {...l, active: l.active === false}); render(); },
  csvMoney() {
    let bal = 0; const rows = money().slice().sort((a, b) => (a.date + a.updatedAt).localeCompare(b.date + b.updatedAt)).map(m => { const e = effect(m); bal += e.acct; return [m.date, locName(m.locationId), m.item, m.type, m.amount, m.paidUsing, m.paidBy, round(e.acct), round(bal), m.notes]; });
    downloadCsv('grabngo-money.csv', [['Date', 'Location', 'Item', 'Type', 'Amount', 'Paid using', 'Paid by', 'Account change', 'Account balance', 'Notes'], ...rows]);
  },
  csvStock() {
    const vmap = Object.fromEntries(data.Visits.map(v => [v.id, v]));
    const rows = data.Stock.filter(s => !s.deleted).sort((a, b) => (a.date + a.updatedAt).localeCompare(b.date + b.updatedAt)).map(s => [s.date, locName(s.locationId), (productById(s.productId) || {}).name || s.productId, s.opening, s.counted, s.sold, s.added, s.closing, s.price, round(num(s.sold) * num(s.price)), (vmap[s.visitId] || {}).by || '']);
    downloadCsv('grabngo-stock.csv', [['Date', 'Location', 'Product', 'Before', 'Left', 'Sold', 'Added', 'Now', 'Price', 'Sales value', 'Checked by'], ...rows]);
  },
  resetDemo() { if (!confirm('Reset demo data on this phone?')) return; data = emptyData(); loadSeedLocal(); chk = newCheck(''); saveDraft(); render(); toast('Demo data reset'); }
};
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function onLineInput(el) {
  const pid = el.dataset.pid, f = el.dataset.f;
  chk.lines[pid] = chk.lines[pid] || {counted: '', added: ''};
  chk.lines[pid][f] = el.value;
  saveDraft(); updateCheckCalc();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;   // let real links (Open / Drive) work
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); }
});
function onInput(e) {
  const el = e.target;
  if (el.dataset.pid) return onLineInput(el);
  if (el.dataset.chk) { chk[el.dataset.chk] = el.type === 'checkbox' ? el.checked : el.value; saveDraft(); return updateCheckCalc(); }
  if (el.dataset.mf) { moneyFilter[el.dataset.mf] = el.value; return render(); }
  if (el.closest('#mform') && mf) { readForm('mform', mf); const x = $('#mEffect'); if (x) x.textContent = effectText(mf); }
  if (el.closest('#pform') && pf) updatePCalc();
}
document.addEventListener('input', onInput);
document.addEventListener('change', e => {
  if (e.target.id === 'proofInput') { const files = [...e.target.files]; e.target.value = ''; if (files.length) addProofFiles(files); return; } if (e.target.dataset.mf || e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onInput(e); });
window.addEventListener('hashchange', () => { route = location.hash.slice(1) || 'home'; if (sheetOpen) closeSheet(true); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#viewer').classList.contains('hidden')) ACT.closeViewer(); });
window.addEventListener('online', () => { setSync(); flush(); pull(); });
window.addEventListener('offline', () => setSync());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 90000);

/* ---------- start ---------- */
if (!data) { data = emptyData(); if (isDemo()) loadSeedLocal(); }
TABLES.forEach(t => { if (!Array.isArray(data[t])) data[t] = []; });
render();
if (!cfg.me) {
  openSheet(`<img class="welcome-logo" src="logo.png" alt=""><h3 style="text-align:center">Welcome to ${esc(bizName())}</h3><p class="muted">Who is using this phone? (You can change this later in More.)</p>
    <div class="stack">${people().map(p => `<button class="btn block" data-act="setMe" data-k="${esc(p)}">I'm ${esc(p)}</button>`).join('')}</div>
    ${isDemo() ? '<div class="note">You are in <b>demo mode</b> with your old Excel data loaded. Connect your Google Sheet in <b>More</b> when ready.</div>' : ''}`);
}
pull();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
